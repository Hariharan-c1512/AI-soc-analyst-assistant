# Production deployment for the real-Wazuh mode (requires Docker).
# For the zero-setup demo, use INGESTION_MODE=mock which needs no containers.
services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.14.7
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - indexer_data:/usr/share/wazuh-indexer/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.7
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=admin
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui
    ports:
      - "55000:55000"
      - "1514:1514/udp"
      - "1515:1515"
    volumes:
      - wazuh_data:/var/ossec/data
    depends_on:
      - wazuh-indexer
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: socadmin
      POSTGRES_PASSWORD: socpass
      POSTGRES_DB: socanalyst
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  wazuh_data:
  pgdata:
  indexer_data:
